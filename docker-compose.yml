services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=billing;Username=billing;Password=billing"
      Billing__Cron: "0 * * * * ?"
    # Sem porta fixa no host e sem container_name: os dois quebram
    # `--scale worker=3`. O Docker sorteia uma porta por replica;
    # `docker compose ps` mostra qual e qual.
    ports:
      - "8080"
